{% extends 'base.html' %}
{% block title %}Register · DataLens{% endblock %}
{% block content %}
<div class="auth-wrap">
    <form method="post" class="auth-card">
        <a class="brand" href="{{ url_for('index') }}"><span class="brand-mark">D</span> DataLens</a>
        <h2>Create your account</h2>
        <p>Start turning spreadsheets into clear insights.</p>
        <label for="name">Full name</label>
        <input class="form-control" id="name" name="name" required>
        <label for="email">Email</label>
        <input class="form-control" id="email" type="email" name="email" required>
        <label for="password">Password</label>
        <div class="input-group">
            <input class="form-control password-input" id="password" type="password" name="password" minlength="6" required>
            <button class="btn btn-outline-secondary password-toggle" type="button" aria-label="Show password">
                <i class="bi bi-eye"></i>
            </button>
        </div>
        <label for="confirm_password">Confirm password</label>
        <div class="input-group">
            <input class="form-control password-input" id="confirm_password" type="password" name="confirm_password" minlength="6" required>
            <button class="btn btn-outline-secondary password-toggle" type="button" aria-label="Show password">
                <i class="bi bi-eye"></i>
            </button>
        </div>
        <button class="btn btn-primary w-100 mt-4">Create account</button>
        <p class="text-center mt-3">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/password-toggle.js') }}"></script>
{% endblock %}
