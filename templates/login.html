{% extends 'base.html' %}
{% block title %}Log in · DataLens{% endblock %}
{% block content %}
<div class="auth-wrap">
    <form method="post" class="auth-card">
        <a class="brand" href="{{ url_for('index') }}"><span class="brand-mark">D</span> DataLens</a>
        <h2>Welcome back</h2>
        <p>Log in to continue exploring your data.</p>
        <label for="email">Email</label>
        <input class="form-control" id="email" type="email" name="email" required>
        <label for="password">Password</label>
        <div class="input-group">
            <input class="form-control password-input" id="password" type="password" name="password" required>
            <button class="btn btn-outline-secondary password-toggle" type="button" aria-label="Show password">
                <i class="bi bi-eye"></i>
            </button>
        </div>
        <button class="btn btn-primary w-100 mt-4">Log in</button>
        <p class="text-center mt-3">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/password-toggle.js') }}"></script>
{% endblock %}
